[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locutus-indexer"
version = "0.1.1"
description = "Manage named plocate databases"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Locutus contributors" }]
dependencies = []

[project.scripts]
locutus = "locutus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
